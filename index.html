
<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Chronicles — 원본 웹 실행</title>
<style>
*{box-sizing:border-box}body{background:#090d16;color:#e8ddc3;margin:0;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:14px}canvas{display:block;width:100%;height:auto;background:#090d16;outline:none;image-rendering:pixelated;border:1px solid #42465a}button{background:#25394a;color:#fff0c8;border:1px solid #758092;border-radius:5px;padding:10px 18px;cursor:pointer}header{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:10px}p{font-size:13px;color:#b3bdca}#error{white-space:pre-wrap;color:#ff9c9c}#status{font-size:14px}
</style></head><body><main>
<header><b>PHYSICS CHRONICLES · 원본 웹 실행</b><button id="start" disabled>로딩 중…</button><span id="status">Python 실행 환경을 불러오는 중입니다. 첫 실행은 시간이 걸릴 수 있습니다.</span></header>
<canvas id="game" width="1100" height="700" tabindex="0"></canvas>
<p>화면 클릭 후 조작 · ← → 이동 · C 더블점프 · ↓+C 발판 통과 · Z 대시 · X 검/지팡이 · V 축복 · F 총/운석 · Space 패링 · Q/W/E 기술 · B 지팡이 구매 · M 설정 · F11 전체화면 · Esc 창 모드<br>PC 키보드용입니다. 탭을 벗어나면 일시정지됩니다. 원본 Python은 그대로 실행하며 화면·입력·음악만 브라우저에 연결합니다.</p><pre id="error"></pre></main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),start=document.getElementById('start'),err=document.getElementById('error');
const audio=new Audio('physics_chronicles.wav');audio.loop=true;audio.volume=.32;
let running=false,focused=false,py,frameFn,keyFn,last=0,acc=0,failed=false;const sprites={},held=new Set();
window.webMusic=(enabled,volume)=>{audio.volume=Math.max(0,Math.min(1,volume));if(enabled&&running&&focused){if(audio.paused)audio.play().catch(()=>{})}else audio.pause()};
window.webFullscreen=enable=>{if(enable){if(!document.fullscreenElement)canvas.requestFullscreen?.().catch(()=>{})}else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})};
window.loadSprites=json=>{for(const [id,img] of Object.entries(JSON.parse(json))){const c=document.createElement('canvas');c.width=img.w;c.height=img.h;const x=c.getContext('2d');for(let y=0;y<img.h;y++)for(let k=0;k<img.w;k++)if(img.rows[y][k]){x.fillStyle=img.rows[y][k];x.fillRect(k,y,1,1)}sprites[id]=c}};
function color(s){if(s==='gray')return '#808080';return s}
function renderItem(item){
 const [kind,a,o]=item;ctx.save();ctx.lineWidth=o.width??1;ctx.strokeStyle=color(o.outline||o.fill||'#000');ctx.fillStyle=color(o.fill||'#000');ctx.lineCap=o.capstyle==='round'?'round':o.capstyle==='projecting'?'square':'butt';if(o.dash)ctx.setLineDash(Array.isArray(o.dash)?o.dash:[4,4]);if(o.stipple)ctx.globalAlpha=.5;
 if(kind==='image'){const im=sprites[o.image];if(im){let x=a[0],y=a[1],anchor=o.anchor||'center';if(!anchor.includes('w'))x-=anchor.includes('e')?im.width:im.width/2;if(!anchor.includes('n'))y-=anchor.includes('s')?im.height:im.height/2;ctx.drawImage(im,x,y)}ctx.restore();return}
 if(kind==='text'){const f=o.font||['sans-serif',10],size=Math.abs(Number(f[1])||10)*4/3;ctx.font=(String(f[2]||'').includes('bold')?'bold ':'')+size+'px sans-serif';const anchor=o.anchor||'center',lines=String(o.text??'').split('\n'),lh=size*1.2;ctx.textAlign=anchor.includes('w')?'left':anchor.includes('e')?'right':'center';ctx.textBaseline='middle';let y=a[1]+(anchor.includes('n')?lh/2:anchor.includes('s')?-(lines.length-.5)*lh:-(lines.length-1)*lh/2);for(const line of lines){ctx.fillText(line,a[0],y);y+=lh}ctx.restore();return}
 ctx.beginPath();let closed=false;
 if(kind==='rectangle'){ctx.rect(a[0],a[1],a[2]-a[0],a[3]-a[1]);closed=true}
 else if(kind==='oval'||kind==='arc'){const cx=(a[0]+a[2])/2,cy=(a[1]+a[3])/2,rx=Math.abs(a[2]-a[0])/2,ry=Math.abs(a[3]-a[1])/2;if(rx>0&&ry>0){let s=kind==='oval'?0:-(o.start||0)*Math.PI/180,e=kind==='oval'?2*Math.PI:s-(o.extent??90)*Math.PI/180;if(kind==='arc'&&(!o.style||o.style==='pieslice'))ctx.moveTo(cx,cy);ctx.ellipse(cx,cy,rx,ry,0,s,e,kind==='arc'&&(o.extent??90)>0);if(kind==='oval'||o.style!=='arc'){ctx.closePath();closed=true}}}
 else{ctx.moveTo(a[0],a[1]);if(o.smooth&&a.length>=6){for(let i=2;i<a.length-2;i+=2)ctx.quadraticCurveTo(a[i],a[i+1],(a[i]+a[i+2])/2,(a[i+1]+a[i+3])/2);ctx.lineTo(a[a.length-2],a[a.length-1])}else for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);if(kind==='polygon'){ctx.closePath();closed=true}}
 if(closed&&o.fill)ctx.fill();if(kind==='line'||o.outline===undefined||o.outline){if(kind==='line')ctx.strokeStyle=color(o.fill||'#000');ctx.stroke()}
 if(kind==='line'&&o.arrow){const tip=(x,y,xx,yy)=>{const angle=Math.atan2(y-yy,x-xx),length=8+ctx.lineWidth;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-length*Math.cos(angle-.4),y-length*Math.sin(angle-.4));ctx.lineTo(x-length*Math.cos(angle+.4),y-length*Math.sin(angle+.4));ctx.closePath();ctx.fill()};if(o.arrow==='last'||o.arrow==='both')tip(a.at(-2),a.at(-1),a.at(-4),a.at(-3));if(o.arrow==='first'||o.arrow==='both')tip(a[0],a[1],a[2],a[3])}
 ctx.restore()
}
window.renderFrame=json=>{ctx.clearRect(0,0,1100,700);for(const i of JSON.parse(json))renderItem(i)};
const keyMap={ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down',' ':'space',Escape:'Escape',Enter:'Return',Backspace:'BackSpace',Tab:'Tab',Shift:'Shift_L',Control:'Control_L',Alt:'Alt_L'};
function keyName(e){if(e.code.startsWith('Key'))return e.code.slice(3).toLowerCase();if(e.code.startsWith('Digit'))return e.code.slice(5);return keyMap[e.key]||e.key}
function keyDown(e){if(!running||failed)return;const k=keyName(e);if(['Left','Right','Up','Down','space'].includes(k))e.preventDefault();if(!held.has(k)){held.add(k);try{keyFn(k,true)}catch(ex){report(ex)}}}
function keyUp(e){const k=keyName(e);held.delete(k);if(keyFn)try{keyFn(k,false)}catch(ex){report(ex)}}
function report(e){failed=true;audio.pause();status.textContent='실행 오류가 발생했습니다. 아래 오류 내용을 전달해 주세요.';err.textContent=String(e);console.error(e)}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);
function pause(){focused=false;audio.pause();for(const k of held)try{keyFn(k,false)}catch(e){}held.clear();acc=0}
function resume(){if(running&&!document.hidden){focused=true;last=performance.now();acc=0}}
canvas.onblur=pause;window.addEventListener('blur',pause);window.addEventListener('focus',resume);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume()});
canvas.onfocus=()=>{focused=true;last=performance.now();if(running)webMusic(true,audio.volume)};
canvas.onclick=()=>{focused=true;last=performance.now();canvas.focus();if(running)webMusic(true,audio.volume)};
start.onclick=()=>{running=true;focused=true;last=performance.now();acc=0;canvas.focus();start.textContent='게임 화면에 포커스';status.textContent='실행 중 · 화면을 벗어나면 일시정지';webMusic(true,audio.volume)};
function loop(now){if(running&&focused&&!failed){acc+=Math.min((now-last)/1000,.1);const steps=Math.min(6,Math.floor(acc*60));if(steps){acc-=steps/60;try{frameFn(steps)}catch(e){report(e)}}}else acc=0;last=now;requestAnimationFrame(loop)}
(async()=>{try{py=await loadPyodide();status.textContent='원본 Python 게임과 그래픽을 준비하고 있습니다…';for(const file of ['original_game.py','web_adapter.py']){const r=await fetch(file);if(!r.ok)throw Error(file+' 다운로드 실패: '+r.status);py.FS.writeFile(file,await r.text())}await py.runPythonAsync('import web_adapter\nweb_adapter.init_game()\nweb_adapter.web_frame(0)');frameFn=py.runPython('web_adapter.web_frame');keyFn=py.runPython('web_adapter.web_key');start.disabled=false;start.textContent='게임 시작 / 음악 켜기';status.textContent='준비 완료 · 시작 버튼을 누르세요';requestAnimationFrame(loop)}catch(e){report(e)}})();
</script></body></html>
