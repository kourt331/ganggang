<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923"><title>왕실과 교회의 전쟁 · 제1장</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#111821;color:#f5eddf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#394352,#18232d 55%,#10151c)}
header{width:min(1040px,100%);margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;color:#f1d49a;font-size:clamp(16px,3vw,23px);letter-spacing:.04em}#state{font-size:12px;color:#bec8c7}main{width:min(1040px,100%);margin:auto;padding:0 16px 20px}#wrap{position:relative;border:1px solid #9f896360;border-radius:15px;overflow:hidden;background:#19232c;box-shadow:0 18px 60px #0007}canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;image-rendering:pixelated;touch-action:none}#error{display:none;white-space:pre-wrap;padding:20px;color:#ffd6c8;background:#291a1b;max-height:60vh;overflow:auto;font-size:12px}#setup{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#101923dd,#101923f5);padding:24px}.card{width:min(460px,100%);border:1px solid #e4c78366;border-radius:18px;background:#17232ff2;padding:clamp(20px,5vw,36px);box-shadow:0 20px 60px #0007}.eyebrow{font-size:11px;color:#e4c783;letter-spacing:.2em}.card h2{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:10px 0}.card p{color:#c9d2d0;font-size:14px}.card label{display:block;color:#d6d4ca;font-size:13px;margin:18px 0 6px}.card input{width:100%;padding:12px;border:1px solid #ffffff30;background:#0d1720;color:white;border-radius:9px;font:inherit}.card button{margin-top:12px;width:100%;padding:12px;background:#e3c37f;border:0;border-radius:9px;color:#20232a;font-weight:800;font:inherit;cursor:pointer}.controls{width:min(960px,100%);margin:10px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 15px;color:#bec8c7;font-size:12px}.controls b{color:#f1d49a}.mobile{display:none;width:min(960px,100%);margin:12px auto 0;justify-content:space-between;gap:12px;touch-action:none;user-select:none}.group{display:flex;gap:6px;align-items:center}.key{min-width:42px;height:42px;border:1px solid #88795f;border-radius:10px;color:#f5eddf;background:#26333d;font-weight:800;touch-action:none}.key:active{background:#806c4a}@media(pointer:coarse){.mobile{display:flex}}@media(max-width:600px){header{padding:10px}main{padding:0 6px 14px}.controls{font-size:10px;gap:4px 8px}.key{min-width:36px;height:38px}.mobile{gap:4px}}
</style></head>
<body>
<header><h1>왕실과 교회의 전쟁 <span style="font-size:.7em;color:#b8c5c5">· 제1장</span></h1><div id="state">Python 게임 준비 중…</div></header>
<main><div id="wrap"><canvas id="game" width="960" height="600" aria-label="탑다운 판타지 RPG"></canvas><pre id="error"></pre><section id="setup"><form class="card" id="nameForm"><div class="eyebrow">TOP-DOWN TURN RPG</div><h2>숲과 왕관,<br>교회의 전쟁</h2><p>이름만 정하고 세계에 들어가세요. 종족·성별·시작 진영은 무작위로 정해집니다. 수인은 왕실에서 시작하지 않습니다.</p><label for="playerName">모험가 이름</label><input id="playerName" maxlength="14" autocomplete="off" placeholder="이름 입력" value=""><button id="start" type="submit" disabled>게임 준비 중…</button></form></section></div>
<div class="controls"><span><b>WASD/방향키</b> 이동</span><span><b>E</b> 대화·조사</span><span><b>1–4</b> 선택/전투</span><span><b>Q</b> 퀘스트</span><span><b>I</b> 소지품</span><span><b>H</b> 붕대</span></div>
<div class="mobile" aria-label="터치 조작"><div class="group"><button class="key" data-hold="ArrowLeft">◀</button><button class="key" data-hold="ArrowUp">▲</button><button class="key" data-hold="ArrowDown">▼</button><button class="key" data-hold="ArrowRight">▶</button></div><div class="group"><button class="key" data-press="e">대화</button><button class="key" data-press="1">공격</button><button class="key" data-press="2">스킬</button><button class="key" data-press="3">방어</button><button class="key" data-press="h">붕대</button></div></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),state=document.getElementById('state'),setup=document.getElementById('setup'),err=document.getElementById('error'),start=document.getElementById('start');
const held=new Set(),presses=[];let click=null,py=null,last=0,acc=0,pyFns=null;ctx.imageSmoothingEnabled=false;
function color(v){return v&&v!=='None'?v:'transparent'}
function draw(payload){const a=JSON.parse(payload);ctx.clearRect(0,0,960,600);for(const q of a){if(q.t==='r'){if(q.c&&q.c!=='#00000000'){ctx.fillStyle=color(q.c);ctx.fillRect(q.x,q.y,q.w,q.h)}if(q.o){ctx.strokeStyle=q.o;ctx.lineWidth=1;ctx.strokeRect(q.x+.5,q.y+.5,q.w-1,q.h-1)}}else if(q.t==='c'){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=color(q.c);ctx.fill();if(q.o){ctx.strokeStyle=q.o;ctx.stroke()}}else if(q.t==='t'){ctx.fillStyle=color(q.c);ctx.font=`${q.size}px system-ui, sans-serif`;ctx.textAlign=q.a||'left';ctx.textBaseline='middle';ctx.fillText(q.s,q.x,q.y,760)}}}
window.gameBridge={draw};
function showError(e){err.style.display='block';err.textContent=String(e);document.getElementById('state').textContent='게임 로딩 오류'}
window.addEventListener('keydown',e=>{const k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();held.add(k);if(!e.repeat)presses.push(k.length===1?k.toLowerCase():k)});
window.addEventListener('keyup',e=>held.delete(e.key));
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();click={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height};canvas.focus()});
document.querySelectorAll('[data-hold]').forEach(b=>{const k=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();held.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>held.delete(k)))});
document.querySelectorAll('[data-press]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();presses.push(b.dataset.press)}));
async function load(){try{state.textContent='Pyodide 런타임 불러오는 중…';py=await loadPyodide();state.textContent='Python 게임 불러오는 중…';const src=await fetch('./game.py',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`game.py HTTP ${r.status}`);return r.text()});await py.runPythonAsync(src);pyFns={start:py.globals.get('start_game'),tick:py.globals.get('tick')};state.textContent='준비 완료';start.disabled=false;start.textContent='항해 시작';}catch(e){showError(e)}}
function frame(t){if(!pyFns){requestAnimationFrame(frame);return}if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;if(acc>=1/30){try{pyFns.tick(acc,JSON.stringify([...held]),JSON.stringify(presses.splice(0)),JSON.stringify(click));}catch(e){showError(e)}acc=0;click=null}requestAnimationFrame(frame)}
load();requestAnimationFrame(frame);
document.getElementById('nameForm').addEventListener('submit',e=>{e.preventDefault();if(!pyFns)return;try{presses.length=0;held.clear();pyFns.start(document.getElementById('playerName').value.trim());setup.style.display='none';canvas.focus();state.textContent='항해 중 · 이름 외의 설정은 무작위';}catch(e){showError(e)}});
})();
</script></body></html>
